<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASAP</title>
  <meta name="description" content="Share one link. Everyone paints when they're free. ASAP finds the time that works for the people who matter.">
  <meta name="theme-color" content="#0a0d0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <header class="top">
    <a class="brand" href="/">asap<span>.tools</span></a>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="orb" aria-hidden="true">
    <nebula-field mode="orb" state="open" certainty="0" density="0.15"></nebula-field>
    <span class="orb-count"></span>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
